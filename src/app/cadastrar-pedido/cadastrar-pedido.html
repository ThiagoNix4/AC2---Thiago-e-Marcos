<form (ngSubmit)="cadastrar()">
  <input [(ngModel)]="bulbasaur" name="bulbasaur" placeholder="nome">
  <input [(ngModel)]="charmander" name="charmander" placeholder="telefone">
  <input [(ngModel)]="squirtle" name="squirtle" placeholder="endereco">
  <input [(ngModel)]="pikachu" name="pikachu" placeholder="produto">
  <input [(ngModel)]="mewtwo" name="mewtwo" placeholder="quantidade">
  <button type="submit">Cadastrar</button>
</form>
<a routerLink="/lista">ir para lista</a>
